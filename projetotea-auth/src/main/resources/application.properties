spring.application.name=projetotea-auth

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.web.error.include-stacktrace=never

projetotea.jwt.keystore.path=keystores/projetoteateste.jks
projetotea.jwt.keystore.password=${KEYSTORE_PASSWORD}
projetotea.jwt.keystore.keypair-alias=projetoteateste

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

server.port=8081
